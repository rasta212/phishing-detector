<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phishing Message Detector</title>
  <meta name="description" content="Rule-based tool that flags common phishing signs in messages and links. Runs in your browser.">
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --accent: #2563eb;
      --border: #d9e2ec;
      --low: #ca8a04;
      --medium: #ea580c;
      --high: #dc2626;
      --none: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --border: #374151;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.7rem; margin: 0 0 8px; }
    .intro { color: var(--muted); margin: 0 0 20px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      min-height: 160px;
      font: inherit;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      resize: vertical;
    }
    button {
      margin-top: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .result-level { font-size: 1.2rem; font-weight: 700; margin: 0 0 8px; }
    .result-level.low { color: var(--low); }
    .result-level.medium { color: var(--medium); }
    .result-level.high { color: var(--high); }
    .result-level.none { color: var(--none); }
    ul { margin: 8px 0 0; padding-left: 20px; }
    .note { color: var(--muted); font-size: 0.9rem; margin-top: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Phishing Message Detector</h1>
    <p class="intro">Paste a message below. The check runs in your browser; your text is not sent anywhere.</p>

    <div class="card">
      <textarea id="message" placeholder="Paste the message here..."></textarea>
      <button id="check">Check message</button>
    </div>

    <div class="card hidden" id="result">
      <p class="result-level" id="level"></p>
      <p id="score"></p>
      <ul id="reasons"></ul>
      <p class="note">No warnings does not guarantee that a message is safe. If a message pressures you or asks for information, contact the company through an official channel before responding.</p>
    </div>
  </main>

  <script>
    const URGENCY = [
      /\burgent(ly)?\b/i,
      /\bimmediately\b/i,
      /\bwithin 24 hours\b/i,
      /\bact now\b/i,
      /\bfinal warning\b/i,
      /\bwill be (locked|suspended|closed|deleted)\b/i,
      /\bsuspended\b/i
    ];
    const SENSITIVE = [
      /\bpassword\b/i,
      /\bverification code\b/i,
      /\bone[- ]time (code|password)\b/i,
      /\bcredit card\b/i,
      /\bbank account\b/i,
      /\bsocial security number\b/i
    ];
    const GREETING = [
      /\bdear (customer|user|client|valued customer)\b/i
    ];
    const URL_RE = /(?:https?:\/\/|www\.)[^\s<>"']+/gi;
    const IP_RE = /^\d{1,3}(\.\d{1,3}){3}$/;
    const SHORTENERS = new Set(["bit.ly", "tinyurl.com", "goo.gl", "t.co", "ow.ly", "is.gd"]);

    function anyMatch(patterns, text) {
      return patterns.some(p => p.test(text));
    }

    function checkUrl(raw) {
      const reasons = [];
      const url = /^https?:\/\//i.test(raw) ? raw : "http://" + raw;
      let parsed;
      try {
        parsed = new URL(url);
      } catch (e) {
        return ["Link could not be parsed"];
      }
      const host = parsed.hostname.toLowerCase();

      if (/^http:\/\//i.test(raw)) reasons.push("Link uses unencrypted HTTP");
      if (parsed.username || parsed.password) {
        reasons.push("Link contains '@', which can hide the real destination");
      }
      if (IP_RE.test(host)) reasons.push("Link points to a raw IP address");
      if (SHORTENERS.has(host)) reasons.push("Link uses a URL shortener that hides the destination");
      return reasons;
    }

    function analyze(text) {
      const reasons = [];
      let score = 0;

      if (anyMatch(URGENCY, text)) {
        score += 2;
        reasons.push("Creates urgency or threatens account closure");
      }
      if (anyMatch(SENSITIVE, text)) {
        score += 2;
        reasons.push("Asks for sensitive information");
      }
      if (anyMatch(GREETING, text)) {
        score += 1;
        reasons.push("Uses a generic greeting instead of your name");
      }

      const found = (text.match(URL_RE) || []).map(u => u.replace(/[.,;:!?)]+$/, ""));
      const urlReasons = [];
      found.forEach(url => {
        checkUrl(url).forEach(r => {
          if (!urlReasons.includes(r)) urlReasons.push(r);
        });
      });
      score += 2 * urlReasons.length;
      reasons.push(...urlReasons);

      let risk;
      if (score >= 5) risk = "High";
      else if (score >= 3) risk = "Medium";
      else if (score >= 1) risk = "Low";
      else risk = "None detected";

      return { risk, score, reasons };
    }

    document.getElementById("check").addEventListener("click", () => {
      const text = document.getElementById("message").value;
      const result = analyze(text);

      const level = document.getElementById("level");
      level.textContent = `Risk level: ${result.risk}`;
      level.className = "result-level " + (result.risk === "None detected" ? "none" : result.risk.toLowerCase());

      document.getElementById("score").textContent = `Score: ${result.score}`;

      const list = document.getElementById("reasons");
      list.innerHTML = "";
      result.reasons.forEach(r => {
        const li = document.createElement("li");
        li.textContent = r;
        list.appendChild(li);
      });

      document.getElementById("result").classList.remove("hidden");
    });
  </script>
</body>
</html>
